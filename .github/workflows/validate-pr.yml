name: Validate PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify toolchain versions
        run: |
          test "$(node -p 'process.versions.node')" = "$(node -p "require('./package.json').engines.node")"
          test "$(npm --version)" = "$(node -p "require('./package.json').engines.npm")"
      - run: npm ci
      - run: npm run test:claims
      - run: npm run lint
      - run: npm run build
      - run: npm run test:governance
      - run: python3 -m unittest discover -s tests -p test_release.py
      - run: python3 scripts/release.py generate "$GITHUB_SHA"
