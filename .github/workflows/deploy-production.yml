name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production assets
        run: npm run build

      - name: Prepare SSH
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -euo pipefail

          HOSTINGER_KEY_FILE="$HOME/.ssh/hostinger_deploy_key"
          HOSTINGER_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          HOSTINGER_SSH_COMMAND="$HOME/.ssh/hostinger_ssh"

          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$HOSTINGER_SSH_KEY" > "$HOSTINGER_KEY_FILE"
          echo "===== BEGIN DEBUG ====="
          wc -l "$HOSTINGER_KEY_FILE"
          file "$HOSTINGER_KEY_FILE"
          cat "$HOSTINGER_KEY_FILE"
          echo "===== END DEBUG ====="
          chmod 600 "$HOSTINGER_KEY_FILE"
          ssh-keygen -lf "$HOSTINGER_KEY_FILE"

          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" 2>/dev/null > "$HOSTINGER_KNOWN_HOSTS_FILE"
          test -s "$HOSTINGER_KNOWN_HOSTS_FILE"
          chmod 600 "$HOSTINGER_KNOWN_HOSTS_FILE"

          cat > "$HOSTINGER_SSH_COMMAND" <<EOF
          #!/usr/bin/env bash
          exec ssh \\
            -i "$HOSTINGER_KEY_FILE" \\
            -p "$HOSTINGER_PORT" \\
            -o IdentitiesOnly=yes \\
            -o StrictHostKeyChecking=yes \\
            -o UserKnownHostsFile="$HOSTINGER_KNOWN_HOSTS_FILE" \\
            "\$@"
          EOF
          chmod 700 "$HOSTINGER_SSH_COMMAND"
          echo "HOSTINGER_SSH_COMMAND=$HOSTINGER_SSH_COMMAND" >> "$GITHUB_ENV"

      - name: Verify SSH connection
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
        run: |
          set -euo pipefail

          "$HOSTINGER_SSH_COMMAND" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "test -d '$HOSTINGER_TARGET_PATH' && test -w '$HOSTINGER_TARGET_PATH'"

      - name: Deploy production build
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
        run: |
          set -euo pipefail

          test -d dist
          rsync -az --delete --checksum --itemize-changes \
            -e "$HOSTINGER_SSH_COMMAND" \
            dist/ \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST:$HOSTINGER_TARGET_PATH/"

      - name: Verify deployment
        shell: bash
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
        run: |
          set -euo pipefail

          "$HOSTINGER_SSH_COMMAND" \
            "$HOSTINGER_USERNAME@$HOSTINGER_HOST" \
            "test -f '$HOSTINGER_TARGET_PATH/index.html'"

      - name: Deployment summary
        shell: bash
        env:
          HOSTINGER_TARGET_PATH: ${{ secrets.HOSTINGER_TARGET_PATH }}
        run: |
          set -euo pipefail

          {
            echo "## Production Deployment"
            echo ""
            echo "- Environment: Production"
            echo "- Build output: dist/"
            echo "- Target path: $HOSTINGER_TARGET_PATH"
            echo "- Status: completed successfully"
          } >> "$GITHUB_STEP_SUMMARY"
